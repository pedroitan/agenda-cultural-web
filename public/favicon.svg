<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="c"><rect width="100" height="100" rx="20"/></clipPath>
  </defs>

  <rect width="100" height="100" rx="20" fill="#fff8f0"/>

  <g clip-path="url(#c)">
    <!-- anéis -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="#ddb8a8" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#ddb8a8" stroke-width="1"/>
    <circle cx="50" cy="50" r="15" fill="none" stroke="#ddb8a8" stroke-width="0.8"/>

    <!-- grade -->
    <line x1="6"  y1="50" x2="94" y2="50" stroke="#ddb8a8" stroke-width="0.8"/>
    <line x1="50" y1="6"  x2="50" y2="94" stroke="#ddb8a8" stroke-width="0.8"/>

    <!-- NOTA ENORME — noroeste, cruza dois anéis -->
    <circle cx="30" cy="24" r="14" fill="none" stroke="#e8001a" stroke-width="1" opacity="0.2"/>
    <ellipse cx="29" cy="32" rx="11" ry="7.5" transform="rotate(-22 29 32)" fill="#e8001a"/>
    <line x1="38" y1="27" x2="38" y2="4" stroke="#e8001a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 38 4 Q 55 9, 53 19 Q 51.5 25, 38 22" fill="#e8001a"/>

    <!-- NOTA MÉDIA — nordeste, anel médio -->
    <ellipse cx="65" cy="30" rx="6" ry="4" transform="rotate(-22 65 30)" fill="#e8001a" opacity="0.8"/>
    <line x1="70" y1="27" x2="70" y2="13" stroke="#e8001a" stroke-width="2.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M 70 13 Q 80 16.5, 79 22.5 Q 78.2 26.5, 70 24.5" fill="#e8001a" opacity="0.8"/>

    <!-- NOTA PEQUENA — sul, anel interno -->
    <ellipse cx="60" cy="62" rx="4" ry="2.7" transform="rotate(-22 60 62)" fill="#e8001a" opacity="0.5"/>
    <line x1="63.5" y1="59.8" x2="63.5" y2="50" stroke="#e8001a" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    <path d="M 63.5 50 Q 71 52.5, 70 57.5 Q 69.2 61, 63.5 59.5" fill="#e8001a" opacity="0.5"/>

    <!-- NOTA ECO — sudoeste distante -->
    <ellipse cx="24" cy="72" rx="2.8" ry="1.9" transform="rotate(-22 24 72)" fill="#e8001a" opacity="0.25"/>
    <line x1="26.5" y1="70.3" x2="26.5" y2="63" stroke="#e8001a" stroke-width="1.3" stroke-linecap="round" opacity="0.25"/>
    <path d="M 26.5 63 Q 32 65, 31.2 69 Q 30.6 71.5, 26.5 70.3" fill="#e8001a" opacity="0.25"/>

    <!-- centro -->
    <circle cx="50" cy="50" r="3"   fill="#e8001a"/>
    <circle cx="50" cy="50" r="1.2" fill="#fff8f0"/>
  </g>
</svg>
