<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Story - Agenda Cultural Salvador</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1920px;
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      position: relative;
      overflow: hidden;
    }

    /* Textura de fundo com pinceladas */
    .texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(ellipse at 10% 20%, rgba(0,0,0,0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(0,0,0,0.05) 0%, transparent 40%),
        radial-gradient(ellipse at 30% 90%, rgba(0,0,0,0.04) 0%, transparent 30%),
        radial-gradient(ellipse at 80% 10%, rgba(0,0,0,0.03) 0%, transparent 35%);
      pointer-events: none;
    }

    /* Pinceladas decorativas */
    .brush-stroke {
      position: absolute;
      background: linear-gradient(45deg, rgba(0,0,0,0.08), rgba(0,0,0,0.02));
      border-radius: 50%;
      transform: rotate(-15deg);
    }

    .brush-1 { top: 5%; left: -5%; width: 300px; height: 80px; }
    .brush-2 { top: 25%; right: -10%; width: 400px; height: 60px; transform: rotate(25deg); }
    .brush-3 { bottom: 30%; left: -8%; width: 350px; height: 70px; }
    .brush-4 { bottom: 10%; right: -5%; width: 280px; height: 50px; transform: rotate(-30deg); }

    .container {
      position: relative;
      z-index: 1;
      padding: 80px 60px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header com título */
    .header {
      text-align: center;
      margin-bottom: 80px;
    }

    .title-main {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 120px;
      color: #ff5722;
      line-height: 0.9;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    }

    .title-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 80px;
      color: #1a1a1a;
      background: #1a1a1a;
      color: white;
      display: inline-block;
      padding: 10px 40px;
      margin-top: 10px;
      border-radius: 8px;
    }

    /* Lista de eventos */
    .events-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .event-item {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .event-date {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 180px;
    }

    .event-day {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 72px;
      color: #ff5722;
      line-height: 1;
    }

    .event-month {
      font-family: 'Inter', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    .event-divider {
      width: 4px;
      height: 80px;
      background: #1a1a1a;
      border-radius: 2px;
    }

    .event-info {
      flex: 1;
    }

    .event-title {
      font-size: 36px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .event-details {
      font-size: 28px;
      color: #555;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: auto;
      padding-top: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .logo-icon {
      font-size: 60px;
    }

    .logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 48px;
      color: #1a1a1a;
    }

    .logo-text span {
      color: #ff5722;
    }

    .instagram-handle {
      font-size: 28px;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- Textura de fundo -->
  <div class="texture"></div>
  <div class="brush-stroke brush-1"></div>
  <div class="brush-stroke brush-2"></div>
  <div class="brush-stroke brush-3"></div>
  <div class="brush-stroke brush-4"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="title-main">Agenda</div>
      <div class="title-sub">da Semana</div>
    </div>

    <!-- Lista de Eventos -->
    <div class="events-list">
      <div class="event-item">
        <div class="event-date">
          <span class="event-day">26</span>
          <span class="event-month">Jan</span>
        </div>
        <div class="event-divider"></div>
        <div class="event-info">
          <div class="event-title">Ensaio do Olodum</div>
          <div class="event-details">Pelourinho, 19h</div>
        </div>
      </div>

      <div class="event-item">
        <div class="event-date">
          <span class="event-day">28</span>
          <span class="event-month">Jan</span>
        </div>
        <div class="event-divider"></div>
        <div class="event-info">
          <div class="event-title">Show Ivete Sangalo</div>
          <div class="event-details">Arena Fonte Nova, 20h</div>
        </div>
      </div>

      <div class="event-item">
        <div class="event-date">
          <span class="event-day">29</span>
          <span class="event-month">Jan</span>
        </div>
        <div class="event-divider"></div>
        <div class="event-info">
          <div class="event-title">Festival de Jazz</div>
          <div class="event-details">Teatro Castro Alves, 21h</div>
        </div>
      </div>

      <div class="event-item">
        <div class="event-date">
          <span class="event-day">30</span>
          <span class="event-month">Jan</span>
        </div>
        <div class="event-divider"></div>
        <div class="event-info">
          <div class="event-title">Carnaval de Rua</div>
          <div class="event-details">Barra-Ondina, 18h</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="logo">
        <span class="logo-icon">🎭</span>
        <span class="logo-text"><span>Agenda</span> Cultural</span>
      </div>
      <div class="instagram-handle">@agendaculturalsalvador</div>
    </div>
  </div>
</body>
</html>
